[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "teams-cli"
requires-python = ">=3.8"
description = "A Microsoft Teams CLI and TUI designed equally for humans and agents"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/rvben/teams-cli"
Repository = "https://github.com/rvben/teams-cli"
Issues = "https://github.com/rvben/teams-cli/issues"
Changelog = "https://github.com/rvben/teams-cli/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
strip = true
