[package]
name = "teams-cli"
version = "0.2.5"
edition = "2024"
rust-version = "1.90"
description = "A Microsoft Teams CLI and TUI designed equally for humans and agents"
license = "MIT"
repository = "https://github.com/rvben/teams-cli"
homepage = "https://github.com/rvben/teams-cli"
documentation = "https://docs.rs/teams-cli"
readme = "README.md"
keywords = ["microsoft-teams", "cli", "tui", "graph", "agents"]
categories = ["command-line-utilities"]
exclude = ["DESIGN.md", "PRODUCT.md", ".local-research/**", ".impeccable/**"]

[[bin]]
name = "teams"
path = "src/main.rs"

[[bin]]
name = "teams-cli"
path = "src/teams_cli_alias.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
crossterm = "0.29"
dirs = "6"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
open = "5"
rand = "0.9"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tempfile = "3"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "process", "io-std"] }
tokio-tungstenite = "0.30"
toml = "1.1"
url = "2"
jiff = "0.2"
unicode-width = "0.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
jsonschema = "0.49.8"
predicates = "3"
wiremock = "0.6"
